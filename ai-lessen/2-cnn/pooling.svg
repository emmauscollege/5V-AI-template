<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" font-family="Work Sans, Helvetica, Arial, sans-serif">
<style>rect{stroke:#9a9a9a} .kop{font-size:15px;fill:#4a4a4a} .klein{font-size:12px;fill:#666} .tekst{font-size:13px;fill:#4a4a4a} text.c{font-size:13px;text-anchor:middle} .groen{fill:none;stroke:#7dc903;stroke-width:4}</style>
<rect width="940" height="340" fill="#fff" stroke="none"/>
<text class="kop" x="20" y="30">1. het beeld (4 bij 4), blok = 2</text>
<text class="kop" x="370" y="30">2. max pooling</text>
<text class="kop" x="660" y="30">3. gemiddelde pooling</text>
<!-- het beeld -->
<rect x="20" y="50" width="50" height="50" fill="#0c0c0c"/><text class="c" x="45" y="80" fill="#fff">12</text><rect x="70" y="50" width="50" height="50" fill="#282828"/><text class="c" x="95" y="80" fill="#fff">40</text><rect x="120" y="50" width="50" height="50" fill="#c8c8c8"/><text class="c" x="145" y="80" fill="#222">200</text><rect x="170" y="50" width="50" height="50" fill="#1c1c1c"/><text class="c" x="195" y="80" fill="#fff">28</text>
<rect x="20" y="100" width="50" height="50" fill="#5a5a5a"/><text class="c" x="45" y="130" fill="#fff">90</text><rect x="70" y="100" width="50" height="50" fill="#fafafa"/><text class="c" x="95" y="130" fill="#222">250</text><rect x="120" y="100" width="50" height="50" fill="#141414"/><text class="c" x="145" y="130" fill="#fff">20</text><rect x="170" y="100" width="50" height="50" fill="#000000"/><text class="c" x="195" y="130" fill="#fff">0</text>
<rect x="20" y="150" width="50" height="50" fill="#000000"/><text class="c" x="45" y="180" fill="#fff">0</text><rect x="70" y="150" width="50" height="50" fill="#1e1e1e"/><text class="c" x="95" y="180" fill="#fff">30</text><rect x="120" y="150" width="50" height="50" fill="#3c3c3c"/><text class="c" x="145" y="180" fill="#fff">60</text><rect x="170" y="150" width="50" height="50" fill="#787878"/><text class="c" x="195" y="180" fill="#fff">120</text>
<rect x="20" y="200" width="50" height="50" fill="#0a0a0a"/><text class="c" x="45" y="230" fill="#fff">10</text><rect x="70" y="200" width="50" height="50" fill="#000000"/><text class="c" x="95" y="230" fill="#fff">0</text><rect x="120" y="200" width="50" height="50" fill="#b4b4b4"/><text class="c" x="145" y="230" fill="#222">180</text><rect x="170" y="200" width="50" height="50" fill="#282828"/><text class="c" x="195" y="230" fill="#fff">40</text>
<rect x="22" y="52" width="96" height="96" fill="none" style="stroke:#7dc903;stroke-width:4"/>
<rect x="122" y="52" width="96" height="96" fill="none" style="stroke:#486ac9;stroke-width:4"/>
<rect x="22" y="152" width="96" height="96" fill="none" style="stroke:#e8890c;stroke-width:4"/>
<rect x="122" y="152" width="96" height="96" fill="none" style="stroke:#b04fc4;stroke-width:4"/>
<line x1="240" y1="150" x2="352" y2="150" stroke="#7dc903" stroke-width="3"/><path d="M350,143 L360,150 L350,157 Z" fill="#7dc903"/>
<text class="kop" x="615" y="155" text-anchor="middle">of</text>
<!-- max -->
<rect x="400" y="80" width="70" height="70" fill="#fafafa" style="stroke:#7dc903;stroke-width:4"/><text class="c" x="435" y="120" fill="#222">250</text>
<rect x="470" y="80" width="70" height="70" fill="#c8c8c8" style="stroke:#486ac9;stroke-width:4"/><text class="c" x="505" y="120" fill="#222">200</text>
<rect x="400" y="150" width="70" height="70" fill="#1e1e1e" style="stroke:#e8890c;stroke-width:4"/><text class="c" x="435" y="190" fill="#fff">30</text>
<rect x="470" y="150" width="70" height="70" fill="#b4b4b4" style="stroke:#b04fc4;stroke-width:4"/><text class="c" x="505" y="190" fill="#222">180</text>
<!-- gem -->
<rect x="690" y="80" width="70" height="70" fill="#626262" style="stroke:#7dc903;stroke-width:4"/><text class="c" x="725" y="120" fill="#fff">98</text>
<rect x="760" y="80" width="70" height="70" fill="#3e3e3e" style="stroke:#486ac9;stroke-width:4"/><text class="c" x="795" y="120" fill="#fff">62</text>
<rect x="690" y="150" width="70" height="70" fill="#0a0a0a" style="stroke:#e8890c;stroke-width:4"/><text class="c" x="725" y="190" fill="#fff">10</text>
<rect x="760" y="150" width="70" height="70" fill="#646464" style="stroke:#b04fc4;stroke-width:4"/><text class="c" x="795" y="190" fill="#fff">100</text>
<text class="klein" x="400" y="245">de grootste uit elk blok</text>
<text class="klein" x="400" y="262">groen: 12, 40, 90, 250 → 250</text>
<text class="klein" x="690" y="245">het gemiddelde van elk blok</text>
<text class="klein" x="690" y="262">groen: (12+40+90+250) / 4 = 98</text>
<text class="tekst" x="20" y="300">Elk blok van 2 bij 2 pixels wordt één pixel. Het beeld wordt dus 2 keer zo smal en 2 keer zo laag.</text>
<text class="tekst" x="20" y="320">Max pooling houdt de sterkste waarde over. Gemiddelde pooling geeft zachte, grijze overgangen.</text>
</svg>