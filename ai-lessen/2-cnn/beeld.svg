<!-- schaal van zwart naar wit -->
<defs><linearGradient id="grijs"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<rect x="20" y="320" width="240" height="20" fill="url(#grijs)"/>
<text class="klein" x="20" y="358">0 = ZWART</text><text class="klein" x="260" y="358" text-anchor="end">255 = WIT</text>
<text class="tekst" x="20" y="400">Elk vakje is een pixel. Het getal is de helderheid: hoe groter, hoe lichter. Zo ziet een cijfer uit MNIST eruit: wit op zwart.</text>
