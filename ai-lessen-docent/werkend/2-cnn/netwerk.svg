<!-- één neuron -->
<rect x="20" y="336" width="900" height="96" rx="8" fill="#f8f8f8" style="stroke:#e4e4e4"/>
<text class="kop" x="36" y="362">Wat doet één neuron?</text>
<text class="tekst" x="36" y="388">Elke invoer keer een gewicht, alles opgeteld:   som = invoer1 × gewicht1 + invoer2 × gewicht2 + ... + invoer1352 × gewicht1352</text>
<text class="tekst" x="36" y="412">Trainen = de gewichten steeds een beetje aanpassen. Dit netwerk heeft 43.706 gewichten. Het uitvoerneuron met de hoogste uitkomst is het antwoord.</text>
